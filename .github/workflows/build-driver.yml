name: Build Kernel Driver

on:
  push:
    branches: [ main, 'feature/kernel-driver' ]
    paths:
      - 'Driver/**'
      - '.github/workflows/build-driver.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Driver/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        platform: [ x64 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver
        working-directory: Driver/Kernel
        run: msbuild driver.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:SignMode=Off /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: OsmiumDriver-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            Driver/build/${{ matrix.platform }}/${{ matrix.configuration }}/*.sys
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/kernel-driver'
    permissions:
      contents: write

    steps:
      - name: Download Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: OsmiumDriver-x64-Release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-dev-${{ github.sha }}
          name: "Kernel Driver Dev Build (${{ github.sha }})"
          body: |
            Automated development build from `feature/kernel-driver`.

            **Commit:** ${{ github.sha }}
            **Ref:** `${{ github.ref_name }}`
          prerelease: true
          files: artifacts/*.sys
