name: Build Kernel Driver

on:
  push:
    branches: [ main, 'feature/kernel-driver' ]
    paths:
      - 'Driver/**'
      - 'Memory/DriverInterface/**'
      - 'examples/**'
      - '.github/workflows/build-driver.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Driver/**'
      - 'Memory/DriverInterface/**'
      - 'examples/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        platform: [ x64 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver
        working-directory: Driver/Kernel
        run: msbuild driver.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:SignMode=Off /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: OsmiumDriver-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            Driver/build/${{ matrix.platform }}/${{ matrix.configuration }}/*.sys
          if-no-files-found: error

  validate:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate IOCTL struct layout
        shell: cmd
        working-directory: Driver/Shared
        run: |
          echo Compiling struct_validate.c (compile-time ABI checks)...
          cl.exe /nologo /W4 /WX /c /TC /std:c11 struct_validate.c
          if errorlevel 1 exit /b 1
          echo All struct layout assertions passed.

      - name: Check vcxproj includes all source files
        shell: pwsh
        run: |
          $kernelDir = "Driver/Kernel"
          $vcxprojPath = "$kernelDir/driver.vcxproj"

          # Get all .c files on disk
          $diskFiles = Get-ChildItem -Path $kernelDir -Filter "*.c" |
                       Select-Object -ExpandProperty Name |
                       Sort-Object

          # Parse ClCompile entries from vcxproj
          [xml]$proj = Get-Content $vcxprojPath
          $ns = @{ ms = "http://schemas.microsoft.com/developer/msbuild/2003" }
          $projFiles = $proj |
                       Select-Xml -XPath "//ms:ClCompile/@Include" -Namespace $ns |
                       ForEach-Object { Split-Path $_.Node.Value -Leaf } |
                       Sort-Object

          # Find .c files missing from vcxproj
          $missing = $diskFiles | Where-Object { $_ -notin $projFiles }

          if ($missing) {
            Write-Host "ERROR: The following .c files are not in driver.vcxproj:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            exit 1
          }

          Write-Host "OK: All $($diskFiles.Count) .c files are listed in driver.vcxproj." -ForegroundColor Green

      - name: Run static analysis (informational)
        shell: cmd
        continue-on-error: true
        working-directory: Driver/Kernel
        run: |
          echo Running /analyze on driver sources (non-blocking)...
          for %%f in (*.c) do (
            echo Analyzing %%f ...
            cl.exe /nologo /W4 /analyze /analyze:only /c /TC /I..\Shared /D_NTDDK_ /DNTDDI_VERSION=0x0A000000 %%f 2>&1
          )
          echo Static analysis complete (results are informational only).

  build-examples:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile examples
        shell: cmd
        run: |
          if not exist examples\build mkdir examples\build
          for %%f in (examples\*.cpp) do (
            echo Compiling %%f ...
            cl.exe /nologo /std:c++latest /EHsc /O2 /DNDEBUG /DWIN32 /D_WINDOWS /Fe:examples\build\%%~nf.exe %%f
            if errorlevel 1 exit /b 1
          )

      - name: Upload example binaries
        uses: actions/upload-artifact@v4
        with:
          name: OsmiumExamples-x64
          path: examples/build/*.exe
          if-no-files-found: error

  release:
    needs: [ build, validate, build-examples ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/kernel-driver'
    permissions:
      contents: write

    steps:
      - name: Download driver artifacts
        uses: actions/download-artifact@v4
        with:
          name: OsmiumDriver-x64-Release
          path: artifacts/driver

      - name: Download example artifacts
        uses: actions/download-artifact@v4
        with:
          name: OsmiumExamples-x64
          path: artifacts/examples

      - name: Zip example binaries
        run: cd artifacts/examples && zip -j ../../OsmiumExamples-x64.zip *.exe

      - name: Delete existing dev release
        run: gh release delete driver-dev-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-dev-latest
          name: "Kernel Driver Dev Build"
          body: |
            Automated development build from `feature/kernel-driver`.

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Updated:** ${{ github.event.head_commit.timestamp }}

            **Artifacts:**
            - `OsmiumDriver.sys` — Kernel driver (Release x64)
            - `OsmiumExamples-x64.zip` — Compiled example binaries (Release x64)
          prerelease: true
          make_latest: false
          files: |
            artifacts/driver/*.sys
            OsmiumExamples-x64.zip
